# Stack de produccion. El compose de desarrollo sigue siendo
# backend/docker-compose.yml, que levanta solo Postgres.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # `:?` corta el `up` nombrando la variable que falta. Sin esto, un .env
      # incompleto se manifiesta como un error de init de Postgres tres capas
      # mas abajo, que no dice cual es la variable vacia.
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en el .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en el .env}
    volumes:
      - motors-db-data:/var/lib/postgresql/data
    logging:
      # La maquina queda prendida meses: sin techo, el JSON de logs crece hasta
      # llenar el disco del Debian y se lleva puesto al stack entero.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin `ports`: la base solo existe dentro de la red del compose.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Las guardas `:?` son exactamente las variables que `backend/src/env.ts`
      # exige sin default: si falta alguna el proceso muere al arrancar, y es
      # mejor que el `up` lo diga antes de construir nada. Las que tienen
      # default o son opcionales no llevan guarda.
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en el .env}
      APP_ORIGIN: ${APP_ORIGIN:?falta APP_ORIGIN en el .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?falta GOOGLE_CLIENT_ID en el .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?falta GOOGLE_CLIENT_SECRET en el .env}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:?falta OAUTH_REDIRECT_URI en el .env}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:?falta SESSION_COOKIE_SECRET en el .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      SEED_INVITED_EMAIL: ${SEED_INVITED_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    # Sin `ports`: solo Next le habla, por la red interna.

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        # NEXT_PUBLIC_* se hornea en el bundle del navegador: tiene que entrar
        # como build arg, no como variable de runtime. En `environment:` no
        # llega nunca al cliente y solo miente sobre lo que se puede cambiar
        # sin reconstruir.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4000
      SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Es el unico servicio expuesto por Funnel y el unico sin forma propia
      # de notar que se colgó: un Next colgado responde igual que uno sano
      # hasta que se lo chequea.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      # El unico puerto publicado, y solo en loopback del host: Funnel proxea
      # desde 127.0.0.1, asi que no se pierde nada, y la app no queda servida
      # en HTTP plano a toda la LAN. Publicar en 0.0.0.0 no se arregla con
      # `ufw`: Docker escribe sus reglas en la cadena DOCKER, antes de INPUT.
      - "127.0.0.1:3000:3000"

volumes:
  motors-db-data:
